name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v5.4.1
        with:
          version: "latest"

      - name: Deploy to test environment
        id: deploy
        if: github.event_name == 'pull_request'
        run: |
          # Capture the deployment output and extract the URL
          DEPLOY_OUTPUT=$(uvx modal deploy deployments/app_deploy.py -e test 2>&1)
          echo "Deployment output:"
          echo "$DEPLOY_OUTPUT"

          # Extract the deployment URL from the output
          DEPLOYMENT_URL=$(echo "$DEPLOY_OUTPUT" | grep -o 'https://[^[:space:]]*\.modal\.run' | head -1)

          if [ -n "$DEPLOYMENT_URL" ]; then
            echo "deployment-url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
            echo "✅ Test deployment successful: $DEPLOYMENT_URL"
          else
            echo "❌ Failed to extract deployment URL from output"
            exit 1
          fi

      - name: Deploy to production environment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          uvx modal deploy deployments/app_deploy.py

      - name: Create deployment summary
        if: github.event_name == 'pull_request' && steps.deploy.outputs.deployment-url != ''
        run: |
          {
            echo "## 🚀 Test Deployment Ready!"
            echo
            echo "Your test deployment is now live and ready for testing:"
            echo
            echo "**🔗 [View Test Deployment](${DEPLOYMENT_URL})**"
            echo
            echo "---"
            echo "*This deployment will be automatically updated when you push new commits to this PR.*"
          } >> $GITHUB_STEP_SUMMARY
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
