name: App

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, unit, Cypress, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Fetch origin/main for the landing diff check
        working-directory: .
        run: bash scripts/ci-fetch-landing-base.sh
      - name: Prove the landing-base fetch on this checkout shape
        working-directory: .
        run: bash scripts/ci-fetch-landing-base.test.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # Puppeteer specs import Chrome from a machine-local path. Cypress is the browser suite.
      - run: npx vitest run --exclude '**/*.browser.test.ts'
      - uses: cypress-io/github-action@v6
        with:
          working-directory: app
          install: false
          browser: chrome
      - name: Upload Cypress screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: app/cypress/screenshots
          if-no-files-found: warn
      - run: npm run build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://ci-placeholder.convex.cloud

  convex-production:
    name: Deploy Convex production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: convex-production-${{ github.repository }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Deploy functions to hallowed-leopard-387
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VERCEL: "1"
          VERCEL_ENV: production
        run: bash scripts/convex-production-deploy.sh
