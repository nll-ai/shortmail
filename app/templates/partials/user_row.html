<tr id="user-row-{{ user.id }}">
    <td>{{ user.email }}</td>
    <td>{{ user.vanity_name }}</td>
    <td>
        <input type="checkbox" {% if user.is_paid %}checked{% endif %} disabled>
    </td>
    <td>
        <button class="edit-button" hx-get="/users/{{ user.id }}/toggle-edit" hx-target="#user-row-{{ user.id }}" hx-swap="outerHTML">Edit</button>
        <button class="delete-button" hx-delete="/users/{{ user.id }}" hx-target="#user-row-{{ user.id }}" hx-swap="outerHTML" hx-confirm="Are you sure you want to delete this user?">Delete</button>
    </td>
</tr>
