<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShortMail Result</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}"></head>
<body>
    <div class="container">
        <h1>ShortMail Result</h1>
        {% if email_sent %}
            <p class="success">Your ShortMail has been sent successfully to {{ recipient_email }}!</p>
        {% else %}
            <p class="error">There was an error sending your ShortMail to {{ recipient_email }}. Please try again later.</p>
        {% endif %}
        <a href="/send/{{ recipient_email }}">Back to {{ recipient_email }}'s ShortMail</a>
    </div>
</body>
</html>
