<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send ShortMail to {{ user.email }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1, h2 {
            color: #333;
        }
        form {
            margin-bottom: 20px;
        }
        select, textarea, input[type="text"], input[type="submit"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        textarea {
            height: 150px;
            resize: vertical;
        }
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        #custom-subject {
            display: none;
        }
        input[type="email"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Send ShortMail to {{ user.email }}</h1>
        <form action="/send/{{ user.email }}" method="post">
            <input type="text" name="sender_name" required placeholder="Your Name">
            <input type="email" name="sender_email" required placeholder="Your Email Address">
            <select name="subject" id="subject-select" required>
                <option value="">Select a subject</option>
                {% for heading in subject_headings %}
                    <option value="{{ heading.heading }}">{{ heading.heading }}</option>
                {% endfor %}
                <option value="OTHER">OTHER</option>
            </select>
            <input type="text" id="custom-subject" name="custom_subject" placeholder="Enter custom subject">
            <textarea name="message" maxlength="500" required placeholder="Type your message here (max 500 characters)"></textarea>
            <input type="submit" value="Send ShortMail">
        </form>
    </div>

    <script>
        document.getElementById('subject-select').addEventListener('change', function() {
            var customSubject = document.getElementById('custom-subject');
            if (this.value === 'OTHER') {
                customSubject.style.display = 'block';
                customSubject.required = true;
            } else {
                customSubject.style.display = 'none';
                customSubject.required = false;
            }
        });
    </script>
</body>
</html>
