{% extends "base.html" %}

{% block title %}Authentication Required - ShortMail{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1>🔒 Authentication Required</h1>
        <p>You need to be logged in to access this page.</p>
        <a href="/login" class="button-primary">Login</a>
    </div>
</div>

<style>
.auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 60vh;
    padding: 2rem;
}

.auth-card {
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    padding: 3rem;
    text-align: center;
    max-width: 400px;
    width: 100%;
}

.auth-card h1 {
    color: #333;
    margin-bottom: 1rem;
    font-size: 1.8rem;
}

.auth-card p {
    color: #666;
    margin-bottom: 2rem;
    font-size: 1.1rem;
}

.button-primary {
    display: inline-block;
    background: #007bff;
    color: white;
    padding: 12px 24px;
    text-decoration: none;
    border-radius: 6px;
    font-weight: 500;
    transition: background-color 0.2s;
}

.button-primary:hover {
    background: #0056b3;
    color: white;
    text-decoration: none;
}
</style>
{% endblock %}
