<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ShortMail{% endblock %}</title>
    <link rel="stylesheet" href='/static/shadcn.css'>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="container">
        <nav class="nav">
            <a href="/" class="nav-brand">ShortMail</a>
            <div class="nav-links">
                {% if user or admin %}
                    <a href="/dashboard" class="nav-link">Dashboard</a>
                    {% if admin and admin.admin_role %}
                        <a href="/admin" class="nav-link">Admin</a>
                    {% endif %}
                    <a href="/logout" class="nav-link">Logout</a>
                {% else %}
                    <a href="/login" class="nav-link">Login</a>
                {% endif %}
            </div>
        </nav>
        <main>
            {% block content %}
            {% endblock %}
        </main>
        <footer class="text-center text-sm text-muted-foreground mt-8">
            <p>&copy; 2024 ShortMail. All rights reserved.</p>
        </footer>
    </div>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
