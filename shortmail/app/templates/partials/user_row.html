<tr id="user-row-{{ user.id }}" hx-target="this" hx-swap="outerHTML">
    <td>{{ user.email }}</td>
    <td>{{ user.display_name or user.email }}</td>
    <td>{{ user.vanity_name }}</td>
    <td>
        <span class="status-badge {% if user.is_paid %}status-paid{% else %}status-free{% endif %}">
            {{ "Paid" if user.is_paid else "Free" }}
        </span>
    </td>
    <td>
        {% if user.admin_role %}
            <span class="role-badge role-{{ user.admin_role }}">
                {{ user.admin_role.replace('_', ' ').title() }}
            </span>
        {% else %}
            <span class="role-badge role-user">User</span>
        {% endif %}
    </td>
    <td class="actions-cell">
        <button class="button button-small" hx-get="/admin/users/{{ user.id }}/toggle-edit">
            Edit
        </button>
        <button class="button button-small button-danger"
                hx-delete="/admin/users/{{ user.id }}"
                hx-confirm="Are you sure you want to delete this user?">
            Delete
        </button>
    </td>
</tr>
