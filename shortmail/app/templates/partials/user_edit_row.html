<tr id="user-row-{{ user.id }}" hx-target="this" hx-swap="outerHTML">
    <td>{{ user.email }}</td>
    <td>{{ user.vanity_name }}</td>
    <td colspan="2">
        <form class="edit-form" hx-post="/users/{{ user.id }}">
            <label>
                <input type="checkbox" name="is_paid" {% if user.is_paid %}checked{% endif %}>
                Paid Status
            </label>
            <button type="submit" class="button button-small">Save</button>
            <button type="button"
                    class="button button-small button-danger"
                    hx-get="/users/{{ user.id }}/toggle-edit">
                Cancel
            </button>
        </form>
    </td>
</tr>
