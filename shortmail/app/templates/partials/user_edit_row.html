<tr id="user-row-{{ user.id }}" hx-target="this" hx-swap="outerHTML">
    <td>{{ user.email }}</td>
    <td>{{ user.display_name or user.email }}</td>
    <td>{{ user.vanity_name }}</td>
    <td colspan="3">
        <form class="edit-form" hx-post="/admin/users/{{ user.id }}">
            <label>
                <input type="checkbox" name="is_paid" {% if user.is_paid %}checked{% endif %}>
                Paid Status
            </label>
            <label>
                <select name="admin_role">
                    <option value="none" {% if not user.admin_role %}selected{% endif %}>User</option>
                    <option value="moderator" {% if user.admin_role == 'moderator' %}selected{% endif %}>Moderator</option>
                    <option value="admin" {% if user.admin_role == 'admin' %}selected{% endif %}>Admin</option>
                    <option value="super_admin" {% if user.admin_role == 'super_admin' %}selected{% endif %}>Super Admin</option>
                </select>
                Admin Role
            </label>
            <button type="submit" class="button button-small">Save</button>
            <button type="button"
                    class="button button-small button-danger"
                    hx-get="/admin/users/{{ user.id }}/toggle-edit">
                Cancel
            </button>
        </form>
    </td>
</tr>
