{% extends "base.html" %}

{% block title %}Manage Users - ShortMail{% endblock %}

{% block extra_head %}
    <script src="https://unpkg.com/htmx.org@2.0.2"></script>
{% endblock %}

{% block content %}
    <h2>Manage Users</h2>
    <table class="manage-users-table">
        <thead>
            <tr>
                <th>Email</th>
                <th>Vanity Name</th>
                <th>Paid</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="user-table-body" hx-get="/users" hx-trigger="load">
            <!-- User list will be loaded here -->
        </tbody>
    </table>

    <!-- Simple text logout link at the bottom -->
    <div class="logout-container">
        <a href="/logout" class="logout">Logout</a>
    </div>
{% endblock %}
