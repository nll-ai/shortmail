{% extends "base.html" %}

{% block title %}Admin Login - ShortMail{% endblock %}

{% block content %}
<div class="flex justify-center items-center min-h-[60vh] p-8">
    <div class="card max-w-md w-full">
        <div class="card-header text-center">
            <h1 class="card-title">Admin Login</h1>
        </div>
        <div class="card-content">
            <form method="post">
                <div class="form-group mb-4">
                    <label for="email" class="form-label">Admin Email:</label>
                    <input type="email" id="email" name="email" required placeholder="Enter admin email" class="form-input">
                </div>
                <button type="submit" class="btn btn-primary w-full">Send Login Link</button>
            </form>
            {% if error %}
            <div class="alert alert-destructive mt-4">
                {{ error }}
            </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
