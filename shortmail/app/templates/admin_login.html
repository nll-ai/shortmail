{% extends "base.html" %}

{% block title %}Admin Login - ShortMail{% endblock %}

{% block content %}
<h1>Admin Login</h1>
<form method="post">
    <div class="form-group">
        <label for="email">Admin Email:</label>
        <input type="email" id="email" name="email" required placeholder="Enter admin email">
    </div>
    <input type="submit" value="Send Login Link" class="button-primary">
</form>
{% if error %}
<p class="error">{{ error }}</p>
{% endif %}
{% endblock %}
