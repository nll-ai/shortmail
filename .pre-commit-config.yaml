repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.0
    hooks:
      - id: nbstripout
  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        args: [-c, pyproject.toml]
  - repo: https://github.com/jsh9/pydoclint
    rev: 0.5.9
    hooks:
      - id: pydoclint
        args:
          - "--config=pyproject.toml"
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.7.2
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix, --exclude, nbconvert_config.py]
  - repo: local
    hooks:
      - id: pixi-install
        name: Keep lockfile up-to-date
        entry: pixi install
        language: system
        always_run: true
        require_serial: true
        pass_filenames: false
  - repo: https://github.com/ericmjl/api-key-precommit
    rev: 0.1.3
    hooks:
      - id: api-key-checker
        args:
          - "--pattern"
          - "[a-zA-Z0-9]{32,}"  # Generic API key pattern (32+ chars)
          - "--pattern"
          - "api[_-]key[_-][a-zA-Z0-9]{16,}"  # API key with prefix
          - "--pattern"
          - "^sk-proj-[A-Za-z0-9_-]+-rev[A-Za-z0-9_\\-\\.]+$"  # Project-specific key pattern
          - "--pattern"
          - "^re_[A-Za-z0-9_-]+$"  # Resend API key pattern
