[project]
authors = [{name = "Eric Ma", email = "ericmajinglong@gmail.com"}]
dependencies = [ "fastapi>=0.115.0,<0.116", "uvicorn>=0.30.6,<0.31", "sqlalchemy>=2.0.35,<3", "jinja2>=3.1.4,<4", "python-multipart>=0.0.10,<0.0.11", "itsdangerous>=2.2.0,<3", "resend>=2.13.0,<3", "workos>=5.9.0,<6"]
description = "Add a short description here"
name = "shortmail"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[tool.pixi.pypi-dependencies]
shortmail = { path = ".", editable = true }

[tool.pixi.tasks]
app = "uvicorn shortmail.app.main:app --reload --port 7196 --host 0.0.0.0"

[tool.pixi.dependencies]
python-dotenv = ">=1.0.1,<2"
starlette = ">=0.38.5,<0.39"
sqlalchemy = ">=2.0.35,<3"
markdown = ">=3.6,<4"
html2text = ">=2024.2.26,<2025"
cryptography = ">=43.0.1,<44"
loguru = ">=0.7.2,<0.8"
pytest = ">=8.3.3,<9"
pyprojroot = ">=0.3.0,<0.4"
httpx = ">=0.27.2,<0.28"


[tool.interrogate]
ignore-init-method = true
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
fail-under = 100
exclude = ["setup.py", "docs", "build", "examples"]
ignore-regex = ["^get$", "^mock_.*", ".*BaseClass.*"]
verbose = 2
quiet = false
whitelist-regex = []
color = true
